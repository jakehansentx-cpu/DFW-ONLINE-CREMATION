<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooler Board</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="board-body">
  <header class="board-header">
    <h1>Cooler Status</h1>
    <div style="display:flex; align-items:center; gap:18px;">
      <button id="moveModeBtn" class="export-btn">📍 Move</button>
      <a class="export-btn" href="{{ url_for('api_board_export') }}" style="text-decoration:none;">Export CSV</a>
      <div id="clock"></div>
      <a href="/logout" style="color:#889; font-size:13px;">Log out</a>
    </div>
  </header>

  <div class="staff-row">
    <label for="staffSelect">Who's working?</label>
    <select id="staffSelect">
      <option value="">-- Select your name --</option>
      {% for name in staff_names %}
      <option value="{{ name }}">{{ name }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="boardTabs" class="board-tabs">
    {% for screen in screens %}
    <button class="board-tab-btn{% if loop.first %} active{% endif %}" data-screen="{{ screen }}">{{ screen }}</button>
    {% endfor %}
  </div>

  <div class="board-search-row">
    <input id="boardSearch" type="text" class="board-search-input" placeholder="Find by name or case #...">
    <button id="boardSearchBtn" class="export-btn">🔍 Find</button>
  </div>
  <div id="boardSearchStatus" class="move-status hidden"></div>

  <div id="moveStatus" class="move-status hidden"></div>
  <div id="releaseReceiptRow" class="hidden" style="margin: 0 16px 12px;">
    <a id="releaseReceiptLink" class="export-btn" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block;">🖨️ Print Release Form</a>
  </div>

  <div id="checkedOutPanel" class="checked-out-panel hidden">
    <div class="checked-out-title">Currently Checked Out</div>
    <div id="checkedOutList"></div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="detail" class="detail-overlay hidden">
    <div class="detail-card">
      <button id="closeDetail" class="close-btn">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <div id="boardConfirm" class="board-confirm-overlay hidden">
    <div class="board-confirm-card">
      <p id="boardConfirmMessage"></p>
      <button id="boardConfirmYesBtn" class="primary-btn">Yes, Confirm</button>
      <button id="boardConfirmNoBtn" class="secondary-btn">Cancel</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
