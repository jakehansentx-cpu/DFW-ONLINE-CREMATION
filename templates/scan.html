<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooler Scan</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="scan-body">
  <header class="scan-header">
    <h1>Cooler Scan Station</h1>
    <div style="text-align:center;"><a href="/logout" style="color:#889; font-size:13px;">Log out</a></div>
  </header>

  <div class="staff-row">
    <label for="staffSelect">Who's working?</label>
    <select id="staffSelect">
      <option value="">-- Select your name --</option>
      {% for name in staff_names %}
      <option value="{{ name }}">{{ name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="sheet-intake">Decedent Information</button>
    <button class="mode-btn" data-mode="move">Move</button>
    <button class="mode-btn" data-mode="release">Release</button>
    <button class="mode-btn" data-mode="cremate">Cremate</button>
    <button class="mode-btn" data-mode="checkout">Check Out / In (Temp)</button>
  </div>

  <div id="pendingBadge" class="pending-badge hidden"></div>

  <div class="scan-panel">
    <div id="stepLabel" class="step-label">Scan the Case ID tag</div>
    <button id="startSheetCaseBtn" class="primary-btn hidden">Start New Case</button>
    <a id="printTagLink" class="secondary-btn hidden" style="display:inline-block; text-decoration:none; text-align:center;" target="_blank" rel="noopener">🖨️ Print Case Tag</a>
    <input id="scanInput" class="scan-input" type="text" autofocus
           placeholder="Tap here, then scan..." autocomplete="off">
    <button id="cameraBtn" class="camera-btn">📷 Use Phone/Tablet Camera Instead</button>
    <div id="cameraPanel" class="camera-panel hidden">
      <video id="cameraVideo" playsinline muted autoplay></video>
      <canvas id="cameraCanvas" class="hidden"></canvas>
      <button id="cameraStopBtn" class="secondary-btn">Stop Camera</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div id="infoForm" class="info-form hidden">
    <h3 id="infoFormTitle">Case Details</h3>
    <label>Decedent's Name</label>
    <input id="fName" type="text">
    <label>Funeral Home</label>
    <input id="fHome" type="text">
    <label>Pickup Date</label>
    <input id="fDate" type="date">
    <label>Time Received (First Call)</label>
    <input id="fTimeReceived" type="time">
    <label>Removal Type</label>
    <input id="fRemovalType" type="text">
    <label>Disposition</label>
    <input id="fDisposition" type="text">
    <label>Removal By</label>
    <input id="fRemovalBy" type="text">
    <label><input id="fNight" type="checkbox" style="width:auto; margin-right:8px;">Night</label>
    <button id="saveInfoBtn" class="primary-btn">Save</button>
  </div>

  <div id="printGate" class="info-form hidden" style="text-align:center;">
    <h3>Print the Armband Tag</h3>
    <p style="color:#aab; margin-bottom:16px;">Print the armband before placing the decedent on a shelf, so a scannable tag always goes with them.</p>
    <a id="printGateBtn" style="display:block; text-decoration:none; text-align:center; font-size:22px; padding:26px; background:#2a5d8a; color:#fff; border-radius:10px;" target="_blank" rel="noopener">🖨️ Print Armband</a>
  </div>

  <div id="releaseForm" class="info-form hidden">
    <h3 id="releaseFormTitle">Release Decedent</h3>
    <label>Released To</label>
    <input id="releasedTo" type="text" placeholder="Funeral home, transport company, etc.">
    <button id="confirmReleaseBtn" class="primary-btn">Confirm Release</button>
    <button id="confirmCrematedBtn" class="secondary-btn" style="margin-top:10px; background:#5c2a2a; color:#fff;">Mark as Cremated (Final Disposition)</button>
  </div>

  <div id="confirmBox" class="info-form hidden" style="text-align:center;">
    <p id="confirmMessage" style="font-size:16px; line-height:1.5;"></p>
    <button id="confirmYesBtn" class="primary-btn">Yes, Confirm</button>
    <button id="confirmNoBtn" class="secondary-btn" style="margin-top:10px;">Cancel</button>
  </div>

  <div id="checkoutForm" class="info-form hidden">
    <h3 id="checkoutFormTitle">Check Out Decedent</h3>
    <label>Organization</label>
    <input id="checkoutOrg" type="text" placeholder="e.g. County Medical Examiner, or funeral home name">
    <label>Reason</label>
    <select id="checkoutReason">
      <option value="Autopsy">Autopsy</option>
      <option value="Organ Donation">Organ Donation</option>
      <option value="Tissue Donation">Tissue Donation</option>
      <option value="Funeral Service">Funeral Service</option>
      <option value="ID Viewing">ID Viewing</option>
      <option value="Other">Other</option>
    </select>
    <button id="confirmCheckoutBtn" class="primary-btn">Confirm Check Out</button>
  </div>

  <div id="checkinForm" class="info-form hidden">
    <h3 id="checkinFormTitle">Check In Decedent</h3>
    <div id="checkinInfo" style="padding:8px 0; color:#aab;"></div>
    <button id="confirmCheckinBtn" class="primary-btn">Confirm Check In</button>
  </div>

  <div class="reset-row">
    <button id="resetBtn" class="secondary-btn">Reset</button>
  </div>

  <script src="{{ url_for('static', filename='jsQR.js') }}"></script>
  <script src="{{ url_for('static', filename='scan.js') }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
      });
    }
  </script>
</body>
</html>
