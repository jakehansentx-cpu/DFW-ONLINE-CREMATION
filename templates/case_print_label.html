<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label — {{ case_code }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  @page { size: 54mm auto; margin: 0; }

  .print-toolbar { text-align: center; padding: 16px; }
  .print-toolbar p { color: #889; font-size: 13px; max-width: 320px; margin: 10px auto 0; }

  #nelko-label {
    width: 54mm;
    margin: 0 auto;
    padding: 2mm;
    box-sizing: border-box;
    background: #fff;
    color: #14151a;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5mm;
  }
  #nelko-label .qr-box { width: 42mm; height: 42mm; }
  #nelko-label .qr-box img { width: 100%; height: 100%; display: block; }
  #nelko-label .line-name,
  #nelko-label .line-home,
  #nelko-label .line-date {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #nelko-label .line-name { font-size: 12pt; line-height: 1.15; }
  #nelko-label .line-home { font-size: 9pt; line-height: 1.15; }
  #nelko-label .line-date { font-size: 8pt; color: #4a4d54; }
  #nelko-label .line-code {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; font-size: 7pt; text-align: center; color: #6a6d74; margin-top: 1mm;
  }

  @media print {
    body * { visibility: hidden; }
    #nelko-label, #nelko-label * { visibility: visible; }
    #nelko-label { position: absolute; top: 0; left: 0; }
    .print-toolbar { display: none; }
  }
</style>
</head>
<body class="scan-body">
  <div class="print-toolbar">
    <button class="primary-btn" onclick="window.print()">Print to Label Printer</button>
    <p>In the print dialog, choose the NELKO printer. If it asks for a paper/media size, pick 54mm roll (or the closest match).</p>
  </div>

  <div id="nelko-label">
    <div class="qr-box">
      <img src="{{ url_for('case_qr_image', case_code=case_code) }}" alt="QR code for {{ case_code }}">
    </div>
    <div class="line-name">{{ case.name or case_code }}</div>
    {% if case.funeral_home %}<div class="line-home">{{ case.funeral_home }}</div>{% endif %}
    {% if pickup_date %}<div class="line-date">{{ pickup_date }}</div>{% endif %}
    <div class="line-code">{{ case_code }}</div>
  </div>

  <script>
    // Shrinks each line's font size (down to a readable floor) until it
    // fits on one line, instead of ellipsis-truncating a long name/
    // funeral home -- runs before print so the fitted size is what
    // actually prints.
    function autoFitLine(el, minFontSize) {
      if (!el) return;
      let fontSize = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth && fontSize > minFontSize) {
        fontSize -= 0.5;
        el.style.fontSize = fontSize + "pt";
      }
    }
    window.addEventListener("load", () => {
      autoFitLine(document.querySelector("#nelko-label .line-name"), 7);
      autoFitLine(document.querySelector("#nelko-label .line-home"), 6);
      autoFitLine(document.querySelector("#nelko-label .line-date"), 6);
    });
  </script>
</body>
</html>
