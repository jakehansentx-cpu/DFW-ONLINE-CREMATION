<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Tag — {{ case_code }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .print-toolbar { text-align: center; padding: 16px; }

  #label {
    width: 3.2in;
    height: 1.1in;
    margin: 0 auto;
    padding: 0.1in;
    border: 1px dashed #667;
    background: #fff;
    color: #14151a;
    display: flex;
    align-items: stretch;
    gap: 0.14in;
  }
  #label .qr-box {
    flex: 0 0 auto;
    width: 1.1in;
    height: 1.1in;
  }
  #label .qr-box img { width: 100%; height: 100%; display: block; }

  #label .text-block {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.04in;
    border-left: 1px solid #e4e1d9;
    padding-left: 0.14in;
  }
  #label .line-name {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 15pt;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #label .line-home {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 10pt;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #label .line-date {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 9pt;
    line-height: 1.2;
    color: #4a4d54;
  }

  @media print {
    body * { visibility: hidden; }
    #label, #label * { visibility: visible; }
    #label { position: absolute; top: 0; left: 0; border: none; }
    .print-toolbar { display: none; }
  }
</style>
</head>
<body class="scan-body">
  <div class="print-toolbar">
    <button class="primary-btn" onclick="window.print()">Print</button>
    <a class="secondary-btn" href="{{ url_for('case_label_image', case_code=case_code) }}" download="armband-{{ case_code }}.png" style="display:inline-block; text-decoration:none; margin-top:10px;">Download Image</a>
  </div>

  <div id="label">
    <div class="qr-box">
      <img src="{{ url_for('case_qr_image', case_code=case_code) }}" alt="QR code for {{ case_code }}">
    </div>
    <div class="text-block">
      <div class="line-name">{{ case.name or case_code }}</div>
      <div class="line-home">{{ case.funeral_home or "" }}</div>
      <div class="line-date">{{ pickup_date or "" }}</div>
    </div>
  </div>
</body>
</html>
