<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Tag — {{ case_code }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .print-toolbar { text-align: center; padding: 16px; }
  #label {
    width: 2.5in;
    margin: 0 auto;
    text-align: center;
    padding: 12px;
    border: 1px dashed #667;
    color: #101418;
    background: #fff;
  }
  #label img { width: 100%; height: auto; display: block; }
  #label .case-code { font-weight: bold; font-size: 15px; margin-top: 6px; }
  #label .case-name { font-size: 13px; margin-top: 2px; }
  #label .case-home { font-size: 11px; color: #333; }

  @media print {
    body * { visibility: hidden; }
    #label, #label * { visibility: visible; }
    #label { position: absolute; top: 0; left: 0; border: none; }
    .print-toolbar { display: none; }
  }
</style>
</head>
<body class="scan-body">
  <div class="print-toolbar">
    <button class="primary-btn" onclick="window.print()">Print</button>
  </div>

  <div id="label">
    <img src="{{ url_for('case_qr_image', case_code=case_code) }}" alt="QR code for {{ case_code }}">
    <div class="case-code">{{ case_code }}</div>
    {% if case.name %}<div class="case-name">{{ case.name }}</div>{% endif %}
    {% if case.funeral_home %}<div class="case-home">{{ case.funeral_home }}</div>{% endif %}
  </div>
</body>
</html>
