<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Tag — {{ case_code }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .print-toolbar { text-align: center; padding: 16px; }

  #label {
    width: 3.2in;
    height: 1.1in;
    margin: 0 auto;
    padding: 0.1in;
    border: 1px dashed #667;
    background: #fff;
    color: #14151a;
    display: flex;
    align-items: stretch;
    gap: 0.14in;
  }
  #label .qr-box {
    flex: 0 0 auto;
    width: 1.1in;
    height: 1.1in;
  }
  #label .qr-box img { width: 100%; height: 100%; display: block; }

  #label .text-block {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.04in;
    border-left: 1px solid #e4e1d9;
    padding-left: 0.14in;
    overflow: hidden; /* lets the auto-fit script below detect vertical overflow via scrollHeight */
  }
  /* All three lines share one font size, kept in sync by autoFitGroup()
     below -- name, funeral home, and date print equally large and bold,
     shrinking together (never independently) only when the text is too
     long/tall to fit this fixed-size tag. */
  #label .line-name,
  #label .line-home,
  #label .line-date {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-align: center;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 22pt;
  }
  #label .line-date { color: #4a4d54; }

  @media print {
    body * { visibility: hidden; }
    #label, #label * { visibility: visible; }
    #label { position: absolute; top: 0; left: 0; border: none; }
    .print-toolbar { display: none; }
  }
</style>
</head>
<body class="scan-body">
  <div class="print-toolbar">
    <button class="primary-btn" onclick="window.print()">Print</button>
    <a class="secondary-btn" href="{{ url_for('case_label_image', case_code=case_code) }}" download="armband-{{ case_code }}.png" style="display:inline-block; text-decoration:none; margin-top:10px;">Download Image</a>
  </div>

  <div id="label">
    <div class="qr-box">
      <img src="{{ url_for('case_qr_image', case_code=case_code) }}" alt="QR code for {{ case_code }}">
    </div>
    <div class="text-block">
      <div class="line-name">{{ case.name or case_code }}</div>
      <div class="line-home">{{ case.funeral_home or "" }}</div>
      <div class="line-date">{{ pickup_date or "" }}</div>
    </div>
  </div>

  <script>
    // Name, funeral home, and date all print at the SAME large size --
    // this shrinks them one step at a time, together, until every line
    // fits its width AND the whole group fits the tag's fixed height.
    // (Never shrinks just one line on its own, so a long funeral home
    // name can't end up smaller than the others.) Runs before print so
    // the fitted size is what actually prints.
    function autoFitGroup(container, elements, minFontSize) {
      // getComputedStyle reports px, but the size is applied back as
      // "Npt" below -- convert once up front (px * 0.75 = pt at the
      // standard 96dpi CSS reference) so the loop doesn't start from a
      // px number mislabeled as pt, which had been quietly INFLATING
      // the very first shrink step instead of shrinking it.
      let fontSize = parseFloat(getComputedStyle(elements[0]).fontSize) * 0.75;
      const fits = () =>
        container.scrollHeight <= container.clientHeight &&
        elements.every((el) => el.scrollWidth <= el.clientWidth);
      while (!fits() && fontSize > minFontSize) {
        fontSize -= 0.25;
        elements.forEach((el) => (el.style.fontSize = fontSize + "pt"));
      }
      // scrollWidth/clientWidth round to whole pixels, so a genuine
      // sub-pixel overflow can read as "equal" (fits() true) one step
      // before it actually is -- take one extra guaranteed-safe step
      // down as a final cushion, as long as there's room above the floor.
      if (fontSize > minFontSize) {
        fontSize -= 0.5;
        elements.forEach((el) => (el.style.fontSize = fontSize + "pt"));
      }
    }
    window.addEventListener("load", () => {
      const textBlock = document.querySelector("#label .text-block");
      const lines = [
        document.querySelector("#label .line-name"),
        document.querySelector("#label .line-home"),
        document.querySelector("#label .line-date"),
      ].filter((el) => el && el.textContent.trim());
      autoFitGroup(textBlock, lines, 7);
    });
  </script>
</body>
</html>
