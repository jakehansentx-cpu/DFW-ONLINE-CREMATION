<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooler Board — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="scan-body">
  <header class="scan-header">
    <h1>Cooler Board</h1>
  </header>
  <div class="scan-panel">
    <form method="POST">
      <div class="step-label">Log in</div>
      <label style="display:block; text-align:left; color:#aab; font-size:14px; margin-top:10px;">Name</label>
      <input type="text" name="username" class="scan-input" autofocus autocomplete="username">
      <label style="display:block; text-align:left; color:#aab; font-size:14px; margin-top:10px;">Password</label>
      <input type="password" name="password" class="scan-input" autocomplete="current-password">
      {% if error %}<div class="status-msg err">{{ error }}</div>{% endif %}
      <button type="submit" class="primary-btn" style="margin-top:14px;">Continue</button>
    </form>
  </div>
</body>
</html>
