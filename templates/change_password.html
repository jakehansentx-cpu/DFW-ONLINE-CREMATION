<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="scan-body">
  <header class="scan-header">
    <h1>Set a New Password</h1>
  </header>
  <div class="scan-panel">
    {% if forced %}
    <p style="color:#aab; font-size:14px; margin-top:0;">You're signing in with a temporary password. Set your own before continuing -- nobody else will know it, including whoever set the temporary one.</p>
    {% endif %}
    <form method="POST">
      <label style="display:block; text-align:left; color:#aab; font-size:14px; margin-top:10px;">New Password</label>
      <input type="password" name="new_password" class="scan-input" autofocus autocomplete="new-password">
      <label style="display:block; text-align:left; color:#aab; font-size:14px; margin-top:10px;">Confirm Password</label>
      <input type="password" name="confirm_password" class="scan-input" autocomplete="new-password">
      {% if error %}<div class="status-msg err">{{ error }}</div>{% endif %}
      <button type="submit" class="primary-btn" style="margin-top:14px;">Set Password</button>
    </form>
    {% if not forced %}
    <div class="reset-row"><a href="/board" style="color:#889; font-size:13px;">Cancel</a></div>
    {% endif %}
  </div>
</body>
</html>
