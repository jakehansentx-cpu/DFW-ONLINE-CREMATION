<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="scan-body">
  <header class="scan-header">
    <h1>Admin</h1>
    <div style="text-align:center; display:flex; justify-content:center; gap:14px;">
      <a href="/board" style="color:#5fa8e0; font-size:13px;">📋 Cooler Board</a>
      <a href="/scan" style="color:#5fa8e0; font-size:13px;">📷 Scan Station</a>
      <a href="/logout" style="color:#889; font-size:13px;">Log out</a>
    </div>
  </header>

  <div class="staff-row">
    <span>Logged in as <b>{{ username }}</b></span>
  </div>

  <div class="info-form">
    <h3 style="margin-top:0;">Add Staff</h3>
    <label>Name</label>
    <input id="newUsername" type="text" placeholder="Staff member's full name" autocomplete="off">
    <label><input id="newUserAdmin" type="checkbox" style="width:auto; margin-right:8px;">Give admin access</label>
    <button id="addUserBtn" class="primary-btn">Add Staff</button>
    <div id="addUserStatus" class="status-msg"></div>
  </div>

  <div class="info-form">
    <h3 style="margin-top:0;">Staff Accounts</h3>
    <div id="userList" class="inventory-list"></div>
  </div>

  <div id="sheetPanel" class="info-form">
    <h3 style="margin-top:0;">This Month's Spreadsheet</h3>
    <p id="sheetPanelMsg" style="color:#aab; font-size:14px;"></p>
    <label>Spreadsheet Link</label>
    <input id="sheetUrlInput" type="text" placeholder="Paste the Google Sheets link here" autocomplete="off">
    <button id="sheetSetBtn" class="primary-btn">Save New Spreadsheet</button>
    <div id="sheetSetStatus" class="status-msg"></div>
  </div>

  <div class="info-form">
    <h3 style="margin-top:0;">Disposition Options</h3>
    <p style="color:#aab; font-size:14px; margin-top:0;">Shown as suggestions on the Disposition field -- staff can still type anything not listed here.</p>
    <label>Add a Disposition</label>
    <input id="newDisposition" type="text" placeholder="e.g. AWAITING PAPERWORK" autocomplete="off">
    <button id="addDispositionBtn" class="primary-btn">Add Disposition</button>
    <div id="addDispositionStatus" class="status-msg"></div>
    <div id="dispositionList" class="inventory-list" style="margin-top:14px;"></div>
  </div>

  <div id="historyOverlay" class="detail-overlay hidden">
    <div class="detail-card">
      <button id="closeHistory" class="close-btn">&times;</button>
      <div class="detail-card-body">
        <div id="historyContent"></div>
      </div>
    </div>
  </div>

  <script>
    window.INITIAL_USERS = {{ users_json | safe }};
    window.INITIAL_DISPOSITIONS = {{ dispositions_json | safe }};
  </script>
  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
